<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SrotPass | Secure Password Manager</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            width: 380px;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .result-container {
            background: #0f172a;
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            border: 1px solid #38bdf8;
        }
        #password-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            color: #f1f5f9;
            word-break: break-all;
        }
        .copy-btn {
            background: #38bdf8;
            border: none;
            color: #0f172a;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .settings { text-align: left; margin-bottom: 1.5rem; }
        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #38bdf8; }
        .btn-generate {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-generate:hover { background: #7dd3fc; transform: translateY(-2px); }
        #strength-meter {
            margin-top: 1.2rem;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SrotPass</h1>
        <p>Cyber Security Capstone Project</p>
        <div class="result-container">
            <span id="password-display">Generating...</span>
            <button class="copy-btn" id="copy-btn">COPY</button>
        </div>
        <div class="settings">
            <div class="setting">
                <label>Length: <span id="length-val" style="color:#38bdf8">16</span></label>
            </div>
            <input type="range" id="length-slider" min="8" max="50" value="16">
            <div class="setting" style="margin-top:15px">
                <label>Numbers (0-9)</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="setting">
                <label>Symbols (!@#$)</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>
        <button class="btn-generate" id="generate-btn">Generate Secure Password</button>
        <div id="strength-meter">Strength: ---</div>
    </div>
    <script>
        const display = document.getElementById('password-display');
        const lengthSlider = document.getElementById('length-slider');
        const lengthVal = document.getElementById('length-val');
        const genBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const strengthText = document.getElementById('strength-meter');

        lengthSlider.oninput = () => lengthVal.innerText = lengthSlider.value;

        function generatePassword() {
            const length = lengthSlider.value;
            const hasNumbers = document.getElementById('numbers').checked;
            const hasSymbols = document.getElementById('symbols').checked;
            let charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (hasNumbers) charset += "0123456789";
            if (hasSymbols) charset += "!@#$%^&*()_+~`|}{[]:;?><,./-=";
            let password = "";
            const randomValues = new Uint32Array(parseInt(length));
            window.crypto.getRandomValues(randomValues);
            for (let i = 0; i < length; i++) {
                password += charset[randomValues[i] % charset.length];
            }
            display.innerText = password;
            updateStrength(length, hasNumbers, hasSymbols);
        }

        function updateStrength(len, num, sym) {
            let entropy = len * (num && sym ? 2 : num || sym ? 1.5 : 1);
            if (entropy < 15) {
                strengthText.innerText = "Strength: Weak 🔴";
                strengthText.style.color = "#ef4444";
            } else if (entropy < 25) {
                strengthText.innerText = "Strength: Medium 🟠";
                strengthText.style.color = "#f59e0b";
            } else {
                strengthText.innerText = "Strength: Strong 🟢";
                strengthText.style.color = "#22c55e";
            }
        }

        copyBtn.onclick = () => {
            navigator.clipboard.writeText(display.innerText);
            copyBtn.innerText = "COPIED!";
            setTimeout(() => copyBtn.innerText = "COPY", 2000);
        };

        genBtn.onclick = generatePassword;
        generatePassword();
    </script>
</body>
</html>
